[project]
name = "unicursal"
version = "0.1.0"
description = "Single-path labyrinths with a hidden picture (Python prototype)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "scipy",
]

[project.optional-dependencies]
# experiments/: AI silhouette bake-off (Claude arm)
experiments = ["anthropic"]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
