<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unicursal main screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F55D4}a:hover{color:#1E3FA8}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #EEF0F4; color: #15171C; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden; position: relative;">

  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 20px;">
    <h1 style="margin: 0; font-size: 20px; font-weight: 600; flex-grow: 1;">New puzzle</h1>
    <button type="button" aria-label="Surprise me" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #15171C; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"></circle></svg>
    </button>
    <button type="button" aria-label="Saved puzzles" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #15171C; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"></path></svg>
    </button>
  </header>

  <section aria-label="Preview" style="flex-shrink: 0; height: 402px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div style="position: relative; height: 352px; width: 100%; display: flex; align-items: center; justify-content: center;">
      <button type="button" aria-label="Previous layout" onClick="{{prev}}" style="position: absolute; left: 8px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: {{prevOpacity}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <button type="button" onClick="{{toggleZoom}}" aria-label="Zoom in on the page" style="padding: 0; border: 0; background: transparent; cursor: zoom-in;">
        <img src="{{imgSrc}}" alt="{{imgAlt}}" style="display: block; height: 340px; width: 263px; background: #FFFFFF; border-radius: 4px; box-shadow: 0 1px 2px rgba(20,24,40,0.12), 0 6px 18px rgba(20,24,40,0.10); object-fit: contain; user-select: none; -webkit-user-drag: none;">
      </button>
      <button type="button" aria-label="Next layout" onClick="{{next}}" style="position: absolute; right: 8px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #15171C; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 13px; color: #4D5262;">{{layoutLabel}}</span>
      <button type="button" onPointerDown="{{peekOn}}" onPointerUp="{{peekOff}}" onPointerLeave="{{peekOff}}" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #C5CAD6; background: {{peekBg}}; color: {{peekFg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; touch-action: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        Hold to see answer
      </button>
    </div>
  </section>

  <section aria-label="Settings" style="flex-grow: 1; min-height: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column;">
    <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 16px;">

      <div style="display: flex; align-items: center; gap: 12px;">
        <img src="{{maskSrc}}" alt="{{maskAlt}}" style="width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #F3F4F7; image-rendering: pixelated;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600;">{{picName}}</span>
          <span style="font-size: 13px; color: #4D5262;">{{picSource}}</span>
        </div>
        <button type="button" onClick="{{swapPic}}" style="height: 40px; padding: 0 12px; border: 0; background: transparent; color: #2F55D4; font-size: 14px; font-weight: 600; border-radius: 20px; cursor: pointer;">Swap (demo)</button>
        <a href="Picture.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: #DCE4FF; color: #1A3696; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none;">Change</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 600; color: #4D5262;">Difficulty</span>
        <div role="group" aria-label="Difficulty" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid #C5CAD6; border-radius: 20px; overflow: hidden;">
          <sc-for list="{{diffs}}" as="d" hint-placeholder-count="3">
            <button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="height: 40px; border: 0; border-left: {{d.divider}}; background: {{d.bg}}; color: {{d.fg}}; font-size: 14px; font-weight: 600; cursor: pointer;">{{d.label}}</button>
          </sc-for>
        </div>
        <span style="font-size: 13px; color: #4D5262;">{{sizeLine}}</span>
        <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 12px; background: {{pfBg}}; color: {{pfFg}};">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16.5v.01"></path></svg>
          <span style="font-size: 13px; line-height: 1.4;">{{pfText}}</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 600; color: #4D5262;">Style</span>
        <div role="group" aria-label="Style" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1px solid #C5CAD6; border-radius: 20px; overflow: hidden;">
          <sc-for list="{{styles}}" as="s" hint-placeholder-count="2">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 40px; border: 0; border-left: {{s.divider}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: 600; cursor: pointer;">{{s.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding-top: 4px; border-top: 1px solid #E6E8EE;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding-top: 10px;">
          <span style="font-size: 15px; font-weight: 600;">Manual controls</span>
          <span style="font-size: 13px; color: #4D5262;">Exact sizes, branching, paper, seed</span>
        </div>
        <button type="button" role="switch" aria-checked="{{manual}}" aria-label="Manual controls" onClick="{{toggleManual}}" style="margin-top: 10px; width: 52px; height: 32px; border-radius: 16px; border: 2px solid {{swBorder}}; background: {{swBg}}; position: relative; cursor: pointer; padding: 0;">
          <span style="position: absolute; top: 4px; left: {{knobLeft}}; width: 20px; height: 20px; border-radius: 10px; background: {{knobBg}};"></span>
        </button>
      </div>

      <sc-if value="{{manual}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-grow: 1; font-size: 14px;">Corridor width</span>
            <button type="button" aria-label="Narrower" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #C5CAD6; background: #FFFFFF; font-size: 18px; color: #15171C; cursor: pointer;">−</button>
            <span style="min-width: 64px; text-align: center; font-size: 14px; font-weight: 600;">{{mmText}}</span>
            <button type="button" aria-label="Wider" style="width: 40px; height: 40px; border-radius: 20px; border: 1px solid #C5CAD6; background: #FFFFFF; font-size: 18px; color: #15171C; cursor: pointer;">+</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 14px;">Paths</span>
            <div role="group" aria-label="Paths" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid #C5CAD6; border-radius: 20px; overflow: hidden;">
              <sc-for list="{{pathsOpts}}" as="p" hint-placeholder-count="2">
                <button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="height: 40px; border: 0; border-left: {{p.divider}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 14px; font-weight: 600; cursor: pointer; opacity: {{p.opacity}};">{{p.label}}</button>
              </sc-for>
            </div>
            <span style="font-size: 12px; color: #4D5262;">{{pathsNote}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-grow: 1; font-size: 14px;">Paper</span>
            <span style="font-size: 14px; font-weight: 600;">Letter</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4D5262" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-grow: 1; font-size: 14px;">Auto-fix picture problems</span>
            <span style="font-size: 14px; font-weight: 600; color: #1E5631;">On</span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="flex-grow: 1; font-size: 14px;">Layout seed</span>
            <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;">{{seedText}}</span>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="flex-shrink: 0; display: flex; gap: 12px; padding: 12px 20px 20px; border-top: 1px solid #E6E8EE; background: #FFFFFF;">
      <button type="button" style="flex-grow: 1; height: 52px; border-radius: 26px; border: 1px solid #C5CAD6; background: #FFFFFF; color: #15171C; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>
        Share
      </button>
      <button type="button" style="flex-grow: 2; height: 52px; border-radius: 26px; border: 0; background: #2F55D4; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3.5h12V9"></path><rect x="3.5" y="9" width="17" height="8" rx="2"></rect><path d="M6 14h12v6.5H6z"></path></svg>
        Print
      </button>
    </div>
  </section>

  <sc-if value="{{zoom}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; background: #15171C; display: flex; flex-direction: column;">
      <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 20px; color: #FFFFFF;">
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">{{imgAlt}} · scroll to pan</span>
        <button type="button" onClick="{{toggleZoom}}" aria-label="Close zoom" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div style="flex-grow: 1; min-height: 0; overflow: auto;">
        <img src="{{imgSrc}}" alt="{{imgAlt}}" style="display: block; width: 774px; height: 1000px; background: #FFFFFF;">
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

    return {
      imgSrc: file,
      imgAlt: (s.peek ? 'Answer key' : 'Puzzle') + ' preview, layout ' + s.seed,
      layoutLabel: 'Layout ' + s.seed + (s.seed === 1 ? ' · best match' : ''),
      prevOpacity: s.seed === 1 ? '0.4' : '1',
      prev: function () { if (s.seed > 1) self.setState({ seed: s.seed - 1 }); },
      next: function () { self.setState({ seed: s.seed === 2 ? 1 : 2 }); },
      peekOn: function () { self.setState({ peek: true }); },
      peekOff: function () { if (self.state.peek) self.setState({ peek: false }); },
      peekBg: s.peek ? '#15171C' : '#FFFFFF',
      peekFg: s.peek ? '#FFFFFF' : '#15171C',
      maskSrc: '/_blob/' + BLOB['mask_' + s.pic + '_' + s.diff],
      zoom: !!s.zoom,
      toggleZoom: function () { self.setState({ zoom: !self.state.zoom }); },
      maskAlt: p.name + ' silhouette at ' + d.grid + ' cells',
      picName: p.name,
      picSource: p.source,
      swapPic: function () { self.setState({ pic: s.pic === 'ghost' ? 'cat' : 'ghost', seed: 1 }); },
      diffs: seg([{ id: 'easy', label: 'Easy' }, { id: 'medium', label: 'Medium' }, { id: 'hard', label: 'Hard' }], s.diff, 'diff', false),
      sizeLine: on ? (d.grid + ' cells · ' + d.mm + ' mm corridors') : (d.grid + ' cells · for ' + d.tool),
      pfBg: d.tone === 'ok' ? '#E1F3E6' : '#FFF1D6',
      pfFg: d.tone === 'ok' ? '#1E5631' : '#5C3B00',
      pfText: d.text,
      styles: seg([{ id: 'flow', label: 'Flow' }, { id: 'classic', label: 'Classic' }], s.style, 'style', false),
      manual: on,
      toggleManual: function () { self.setState({ manual: !s.manual }); },
      swBorder: on ? '#2F55D4' : '#7A8090',
      swBg: on ? '#2F55D4' : '#E6E8EE',
      knobLeft: on ? '26px' : '4px',
      knobBg: on ? '#FFFFFF' : '#7A8090',
      mmText: d.mm.toFixed(1) + ' mm',
      pathsOpts: seg([{ id: 'one', label: 'One path' }, { id: 'branch', label: 'Branching' }], s.style === 'flow' ? 'one' : s.paths, 'paths', s.style === 'flow'),
      pathsNote: s.style === 'flow' ? 'Branching needs Classic style for now.' : (useMaze ? 'A real maze with dead ends. Consider printing the answer key.' : 'One winding path, no dead ends.'),
      seedText: '#' + (s.seed === 1 ? '40217' : '88153')
    };
  }
}
</script>
</body>
</html>
