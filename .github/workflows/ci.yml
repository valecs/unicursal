# Green CI means a PR is safe to merge: every job below must pass (the `ci`
# job at the end aggregates them, for branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python prototype (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies (rsvg-convert)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run pytest -q

  rust:
    # The golden tests pin output hashes, so passing on both CPUs (and on
    # wasm32 below) means all three produce bit-identical puzzles (#5, #10).
    name: Rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Core without the parallel feature (golden hashes must not change)
        run: cargo test -p unicursal-core --locked

  wasm:
    name: Rust (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - name: Core tests on wasm32-wasip1 (wasmtime)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: cargo test -p unicursal-core --target wasm32-wasip1 --locked
      - name: Core builds for the browser target
        run: cargo build -p unicursal-core --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p unicursal-core --target wasm32-unknown-unknown --locked -- -D warnings

  ci:
    name: CI
    if: always()
    needs: [python, rust, wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
